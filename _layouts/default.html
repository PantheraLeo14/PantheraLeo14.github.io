<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101211">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}首页">
          <img class="brand-mark" src="{{ '/assets/favicon.svg' | relative_url }}" alt="" aria-hidden="true">
          <span class="brand-name">{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
          <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' %} aria-current="page"{% endif %}>文章</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>关于</a>
        </nav>
        <a class="header-rss" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS 订阅">RSS <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main id="main" class="site-main">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p>{{ site.description }}</p>
        <span>科研、实习、游戏与日常 · {{ site.time | date: '%Y' }}</span>
      </div>
    </footer>
  </body>
</html>
