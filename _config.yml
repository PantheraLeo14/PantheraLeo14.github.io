title: PantheraLeo 的博客
description: 一只没人要的猫
author: PantheraLeo
lang: zh-CN
timezone: Asia/Shanghai
url: "https://pantheraleo14.github.io"
baseurl: ""

permalink: /:year/:month/:day/:title/
markdown: kramdown
post_categories:
  - 科研
  - 游戏
  - 交易
  - 减重
  - Daily Work
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - _templates
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - scripts

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
